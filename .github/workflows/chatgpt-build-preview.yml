name: ChatGPT Android Runtime Preview

on:
  push:
    branches: [fix/android-runtime-preview]
  workflow_dispatch:

jobs:
  user-function-screenshots:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Remove unused incompatible dependency
        run: |
          sed -i "/rounded_loading_button:/d" uber_users_app/pubspec.yaml
          sed -i "/package:rounded_loading_button\/rounded_loading_button.dart/d" uber_users_app/lib/authentication/register_screen.dart
          sed -i "/package:rounded_loading_button\/rounded_loading_button.dart/d" uber_users_app/lib/authentication/user_information_screen.dart
      - name: Dependencies
        working-directory: uber_users_app
        run: flutter pub get
      - name: Build User demo APK from real app widgets
        working-directory: uber_users_app
        run: flutter build apk --debug -t lib/screenshot_main.dart
      - name: Enable Android emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Run User App and capture clean real screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -x
            mkdir -p user-screens logs
            adb wait-for-device
            adb install -r uber_users_app/build/app/outputs/flutter-apk/app-debug.apk
            adb shell pm grant com.example.uber_users_app android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant com.example.uber_users_app android.permission.ACCESS_COARSE_LOCATION || true
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            adb shell am force-stop com.android.launcher3 || true
            adb shell am force-stop com.android.systemui || true
            sleep 2
            adb shell input keyevent KEYCODE_HOME || true
            sleep 1
            adb shell am force-stop com.example.uber_users_app
            adb shell monkey -p com.example.uber_users_app -c android.intent.category.LAUNCHER 1
            sleep 12
            adb shell input keyevent KEYCODE_BACK || true
            sleep 1
            adb shell input keyevent KEYCODE_BACK || true
            sleep 1
            adb shell input keyevent KEYCODE_BACK || true
            sleep 1
            adb shell input keyevent KEYCODE_BACK || true
            sleep 1
            adb shell am start -n com.example.uber_users_app/.MainActivity || true
            sleep 5
            adb shell dumpsys window windows | grep -E 'mCurrentFocus|mFocusedApp' > logs/focus-home.txt || true
            adb exec-out screencap -p > user-screens/01-user-home.png
            adb shell input tap 540 2220 || true
            sleep 3
            adb exec-out screencap -p > user-screens/02-user-profile.png
            adb shell input tap 900 2220 || true
            sleep 3
            adb exec-out screencap -p > user-screens/03-user-about.png
            adb shell input tap 180 2220 || true
            sleep 2
            adb shell input tap 130 255 || true
            sleep 3
            adb exec-out screencap -p > user-screens/04-user-menu.png
            adb shell input keyevent KEYCODE_BACK || true
            sleep 2
            adb shell input tap 540 1985 || true
            sleep 3
            adb exec-out screencap -p > user-screens/05-user-destination.png
            adb shell dumpsys activity activities > logs/activity.txt || true
            adb logcat -d -v threadtime > logs/user-logcat.txt || true
            adb shell pidof com.example.uber_users_app > logs/user-pid.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: user-app-five-real-screenshots
          path: |
            user-screens/
            logs/
          if-no-files-found: error
