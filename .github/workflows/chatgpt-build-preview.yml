name: ChatGPT Android Build Preview

on:
  push:
    branches: [master]

jobs:
  driver-screenshot:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: uber_drivers_app
        run: flutter pub get
      - name: Build debug APK
        working-directory: uber_drivers_app
        run: flutter build apk --debug
      - name: Run on Android emulator and capture real screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p screenshots
            adb install -r uber_drivers_app/build/app/outputs/flutter-apk/app-debug.apk
            adb shell am force-stop com.example.uber_drivers_app
            adb shell monkey -p com.example.uber_drivers_app -c android.intent.category.LAUNCHER 1
            sleep 12
            adb exec-out screencap -p > screenshots/driver-launch.png
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml screenshots/driver-window.xml || true
      - uses: actions/upload-artifact@v4
        with:
          name: driver-real-screenshots
          path: screenshots/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: uber_drivers_app-debug-apk
          path: uber_drivers_app/build/app/outputs/flutter-apk/app-debug.apk

  user-build-preview:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Remove unused incompatible preview dependency
        run: |
          sed -i "/rounded_loading_button:/d" uber_users_app/pubspec.yaml
          sed -i "/package:rounded_loading_button\/rounded_loading_button.dart/d" uber_users_app/lib/authentication/register_screen.dart
          sed -i "/package:rounded_loading_button\/rounded_loading_button.dart/d" uber_users_app/lib/authentication/user_information_screen.dart
      - name: Dependencies
        working-directory: uber_users_app
        run: flutter pub get
      - name: Build debug APK
        working-directory: uber_users_app
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: uber_users_app-preview-debug-apk
          path: uber_users_app/build/app/outputs/flutter-apk/app-debug.apk
