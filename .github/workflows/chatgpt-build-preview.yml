name: ChatGPT Android Runtime Preview

on:
  push:
    branches: [fix/android-runtime-preview]
  workflow_dispatch:

jobs:
  driver-function-screenshots:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: uber_drivers_app
        run: flutter pub get
      - name: Build demo APK from real app widgets
        working-directory: uber_drivers_app
        run: flutter build apk --debug -t lib/screenshot_main.dart --dart-define=DEMO_MODE=true
      - name: Enable Android emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Capture Home Earnings Trips Profile screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -x
            mkdir -p demo-screens logs
            adb wait-for-device
            adb install -r uber_drivers_app/build/app/outputs/flutter-apk/app-debug.apk
            adb shell am force-stop com.example.uber_drivers_app
            adb shell monkey -p com.example.uber_drivers_app -c android.intent.category.LAUNCHER 1
            sleep 10

            adb exec-out screencap -p > demo-screens/01-home.png
            adb shell input tap 540 145 || true
            sleep 2
            adb exec-out screencap -p > demo-screens/02-go-online-dialog.png
            adb shell input keyevent 4 || true
            sleep 1

            adb shell input tap 405 2220 || true
            sleep 3
            adb exec-out screencap -p > demo-screens/03-earnings.png

            adb shell input tap 675 2220 || true
            sleep 3
            adb exec-out screencap -p > demo-screens/04-trips.png

            adb shell input tap 945 2220 || true
            sleep 3
            adb exec-out screencap -p > demo-screens/05-profile.png

            adb logcat -d -v threadtime > logs/demo-logcat.txt || true
            adb shell pidof com.example.uber_drivers_app > logs/demo-pid.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: driver-demo-full-real-screenshots
          path: |
            demo-screens/
            logs/
          if-no-files-found: error

  user-build-preview:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Remove unused incompatible preview dependency
        run: |
          sed -i "/rounded_loading_button:/d" uber_users_app/pubspec.yaml
          sed -i "/package:rounded_loading_button\/rounded_loading_button.dart/d" uber_users_app/lib/authentication/register_screen.dart
          sed -i "/package:rounded_loading_button\/rounded_loading_button.dart/d" uber_users_app/lib/authentication/user_information_screen.dart
      - name: Dependencies
        working-directory: uber_users_app
        run: flutter pub get
      - name: Build debug APK
        working-directory: uber_users_app
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: uber_users_app-preview-debug-apk-fixed-branch
          path: uber_users_app/build/app/outputs/flutter-apk/app-debug.apk
